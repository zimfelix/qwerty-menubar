name: Verify and build (manual)

# Deliberately opt-in: private macOS runner minutes can be billable.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build standalone app
        run: ./scripts/build.sh
      - name: Logic, assets and static checks
        run: |
          .venv/bin/pytest -q
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/python -m pip wheel --no-deps . --wheel-dir dist/wheels
          bash -n scripts/build.sh scripts/install.sh
      - name: Verify app signature
        run: codesign --verify --deep --strict 'dist/QWERTY Menu Bar.app'
      - uses: actions/upload-artifact@v4
        with:
          name: QWERTY-Menu-Bar-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
